name: Security CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure reports directory exists
        run: mkdir -p reports

      - name: Run unit and AI security tests
        run: pytest -v

      - name: Run Bandit SAST
        continue-on-error: true
        run: bandit -r app/ -f json -o reports/bandit-report.json

      - name: Run Semgrep SAST
        continue-on-error: true
        run: semgrep scan --config security/semgrep/rules.yml --json --output reports/semgrep-report.json app/

      - name: Run pip-audit dependency scan
        continue-on-error: true
        run: pip-audit -f json -o reports/dependency-report.json

      - name: Build Docker image
        run: docker build -t vulnfinbot:latest .

      - name: Scan Docker image with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "vulnfinbot:latest"
          format: "json"
          output: "reports/trivy-report.json"

      - name: Run OWASP ZAP baseline scan
        continue-on-error: true
        run: |
          docker run -d --name vulnfinbot-app -p 5000:5000 vulnfinbot:latest
          sleep 3
          docker run --rm --network host \
            -v "$(pwd)/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5000 -J zap-report.json || true
          docker rm -f vulnfinbot-app || true

      - name: Upload all security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnfinbot-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn